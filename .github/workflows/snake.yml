
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: asif-visionary
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Slow down the generated animation
      - name: Reduce Snake Animation Speed
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("dist/github-snake.svg"),
              Path("dist/github-snake-dark.svg")
          ]

          for file in files:
              content = file.read_text()

              content, count = re.subn(
                  r'(animation:\s*none\s+linear\s+)(\d+(?:\.\d+)?)(ms\s+infinite)',
                  lambda m: m.group(1) + str(float(m.group(2)) * 3) + m.group(3),
                  content
              )

              if count == 0:
                  raise RuntimeError(f"Animation duration not found in {file}")

              file.write_text(content)
              print(f"Slowed down: {file}")

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
